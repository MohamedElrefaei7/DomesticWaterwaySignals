; Registers the `integration` marker so an unmarked run does not emit PytestUnknownMarkWarning.
;
; A warning nobody can fix is a warning everybody learns to scroll past, and the next warning —
; the one that matters — scrolls past with it.
;
; The integration tier is NOT deselected by default. It skips itself, loudly and with a stated
; reason, when DATABASE_URL is absent (see tests/orchestration/conftest.py). A default
; `-m "not integration"` would make the same tests vanish from the report silently, which is the
; failure mode CLAUDE.md § 2's theme 2 describes.
;
; Run only the unit tier:        pytest -m "not integration"
; Run only the integration tier: DATABASE_URL=... pytest -m integration

[pytest]
testpaths = tests
markers =
    integration: requires a real Postgres via DATABASE_URL; skips with a reason when it is absent
