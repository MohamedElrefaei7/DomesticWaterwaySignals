# Inland Waterway Signals — the database, and only the database.
#
# CLAUDE.md § 6 fixes the final stack at five containers; `worker`, `api`, and `caddy` are later
# commits and are deliberately absent here. This file defines exactly one service.
#
# Three things in here are load-bearing and easy to "tidy" into being wrong:
#
#   1. NO `ports:` KEY. CLAUDE.md § 6 marks this service internal-only. Publishing 5432 — even
#      bound to 127.0.0.1 — puts the database on the host's network namespace, which is a
#      different security posture from "reachable only over the compose network". Phase 2's
#      scheduler runs from a host venv and therefore does need host reachability while it is being
#      verified; that is handled by an override file kept OUTSIDE this repo (see the live
#      verification steps in the commit report), not by adding a port here where it would outlive
#      the reason for it.
#
#   2. NO `user:` KEY. The official Postgres entrypoint starts as root, chowns PGDATA to the
#      postgres user, and only then drops privileges. Setting `user:` skips the chown, and initdb
#      then fails against a root-owned bind mount with an error that reads like a bug in the image
#      rather than like a configuration mistake here.
#
#   3. NO `command:` OR `entrypoint:` KEY, and in particular nothing that invokes the schema
#      runner. CLAUDE.md § 3: schema changes never run on container start, because `restart:
#      unless-stopped` would turn a crash loop into a schema-change loop. The runner is a CLI a
#      human invokes. tests/orchestration/test_migration_ordering.py asserts this file's
#      non-comment text never names it.

services:
  timescaledb:
    # PINNED BY DIGEST, AND TAGGED. Both halves are load-bearing; neither is decoration.
    #
    # CLAUDE.md § 5: every image is pinned and resolved *from the machine that runs it*, never
    # from a developer laptop's cache and never from an agent's recollection. `latest` on a
    # database image resolved to two different TimescaleDB versions three months apart on the
    # prior project and cost a full session.
    #
    # THE DIGEST IS THE PIN. Docker resolves `name:tag@sha256:...` by digest and ignores the tag,
    # so the two cannot disagree about what actually runs.
    #
    # THE TAG IS HOW THE DIGEST IS RE-DERIVABLE, and it is why this is not a bare
    # `name@sha256:...` reference. A digest is unresolvable in the one direction anyone ever needs
    # it: when the pin fails, the operator has to know which tag to pull in order to obtain the
    # correct digest, and a digest-only reference does not say. That is not hypothetical - it is
    # exactly how this line failed on the first attempt.
    #
    # Do not hand-edit the digest. `verify/preflight.py --write-digest` reads the tag below, asks
    # the local Docker daemon for that tag's repository digest, and rewrites this line. A
    # 64-character content hash is not a value a human should be typing: one wrong character
    # produces an error indistinguishable from a network failure.
    image: timescale/timescaledb:2.26.2-pg16@sha256:332b99870c99c20d0d852ec600c097ee00ac93f5e0c75a8e83673394cdb36bfd

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waterway}
      POSTGRES_USER: ${POSTGRES_USER:-waterway}
      # `:?` makes an unset password a hard startup failure rather than a container that comes up
      # with an empty one. The value lives in .env, which is gitignored; see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset - copy .env.example to .env and fill it in}

    volumes:
      # The separate EBS data volume from Phase 1, mounted by UUID via fstab (CLAUDE.md § 5).
      # Not a named Docker volume: a named volume lives under /var/lib/docker on the ROOT disk,
      # which is exactly the disk this project went to the trouble of not storing data on.
      - /mnt/data/timescaledb:/var/lib/postgresql/data

    healthcheck:
      # -U/-d are required: bare `pg_isready` checks with the wrong default user and reports a
      # server that is up and rejecting us as healthy.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waterway} -d ${POSTGRES_DB:-waterway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Postgres uses shared memory for parallel query and hash joins; Docker's 64MB default is far
    # below what a 16-core-adjacent planner will try to take, and the failure is a runtime
    # "could not resize shared memory segment" during a large query, not a startup error.
    shm_size: 256mb

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
