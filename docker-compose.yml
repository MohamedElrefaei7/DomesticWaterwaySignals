# Inland Waterway Signals — the database, the read API, the frontend build, and the reverse proxy.
#
# CLAUDE.md § 6 fixes the final stack. This file defines FIVE services: the scheduler joined in
# Phase 12, and with it the scheduler began running in production for the first time.
#
# ===============================================================================================
# THE SCHEDULER CONTAINER DOES NOT GET THE DOCKER SOCKET, AND NOTHING HERE DOES.
# ===============================================================================================
#
# Until Phase 12 the backup job shelled out to `docker run` against the pinned server image. A
# container cannot do that without /var/run/docker.sock, and mounting it is ROOT-EQUIVALENT ON THE
# HOST: anything that can talk to the daemon can start a privileged container with / bind-mounted.
# A compromise of the container whose job is running scheduled Python would become a compromise of
# the instance, through a mount that reads like plumbing in this file.
#
# pg_dump and pg_restore live inside Dockerfile.scheduler instead, pinned to the server's major.
# tests/deploy/test_compose_shape.py asserts the socket is absent from EVERY service, not just
# from `scheduler` - a scheduler-only assertion invites somebody to add it to `api`.
#
# ===============================================================================================
# PHASE 10 CHANGED WHO CAN REACH THIS STACK. IT IS NOW THE PUBLIC INTERNET.
# ===============================================================================================
#
# Through Phase 9 the only route in was an SSM tunnel from one IP. From this commit, `caddy`
# publishes 80 and 443 to the world. Two properties carry the whole weight of that being safe, and
# both are asserted in tests/deploy/test_compose_shape.py rather than trusted:
#
#   ONLY CADDY PUBLISHES PORTS. The published-port set across the entire stack is exactly
#   {80, 443}. `api` publishes nothing and `timescaledb` publishes nothing — Caddy reaches the API
#   over the Compose network by service name. Publishing 8000 "for debugging" is the tempting
#   version of this mistake: a published container port is DNAT'd and traverses FORWARD, so it is
#   reachable through the DOCKER-USER chain's published-port path, bypassing Caddy, TLS, and
#   anything else that lives at the edge. It would look harmless in this file.
#
#   THE API CONTAINER IS NEVER GIVEN `DATABASE_URL`. It gets `API_DATABASE_URL` and nothing else.
#   app/api/dependencies.py falls back to `DATABASE_URL` with a warning when the read-only role's
#   URL is absent; inside this container there is nothing to fall back TO, so the fallback cannot
#   quietly connect the public API as the database owner.
#
# Four things in here are load-bearing and easy to "tidy" into being wrong:
#
#   1. NO `ports:` KEY ON ANYTHING BUT CADDY. CLAUDE.md § 6 marks the database internal-only.
#      Publishing 5432 — even bound to 127.0.0.1 — puts the database on the host's network
#      namespace, which is a different security posture from "reachable only over the compose
#      network". The out-of-repo override that publishes it on loopback is still what the HOST-SIDE
#      tooling uses — the migration runner, `verify/preflight.py`'s migration gate, and every
#      `verify/phase11` stage connect from the host, and the migration runner cannot move into a
#      container because the images deliberately do not contain `migrations/` (CLAUDE.md § 3). The
#      scheduler no longer needs it. NOTHING IN THIS FILE DEPENDS ON THAT OVERRIDE — the api and
#      scheduler containers talk to `timescaledb:5432`.
#
#   2. NO `user:` KEY. The official Postgres entrypoint starts as root, chowns PGDATA to the
#      postgres user, and only then drops privileges. Setting `user:` skips the chown, and initdb
#      then fails against a root-owned bind mount with an error that reads like a bug in the image
#      rather than like a configuration mistake here.
#
#   3. NO `command:` OR `entrypoint:` KEY, and in particular nothing that invokes the schema
#      runner. CLAUDE.md § 3: schema changes never run on container start, because `restart:
#      unless-stopped` would turn a crash loop into a schema-change loop. The runner is a CLI a
#      human invokes. tests/orchestration/test_migration_ordering.py asserts this file's
#      non-comment text never names it. That test is why the frontend build's copy step lives in
#      Dockerfile.frontend's CMD and not in a `command:` here.
#
#   4. SERVICE ORDER IN THIS FILE IS NOT LOAD-BEARING, and it used to be. `verify/preflight.py`
#      gate 1 once read the FIRST `image:` line here and checked that one reference, so which image
#      was gated was decided by file order and a reorder silently re-pointed the only live digest
#      check. Gate 1 now enumerates EVERY `image:` line in this file and EVERY `FROM` line in every
#      Dockerfile, reports each by name, and --write-digest rewrites all of them. Still a regex
#      rather than a YAML parse, for the original reason: a round-trip through a YAML library would
#      discard every comment in this file, including this one.

services:
  timescaledb:
    # PINNED BY DIGEST, AND TAGGED. Both halves are load-bearing; neither is decoration.
    #
    # CLAUDE.md § 5: every image is pinned and resolved *from the machine that runs it*, never
    # from a developer laptop's cache and never from an agent's recollection. `latest` on a
    # database image resolved to two different TimescaleDB versions three months apart on the
    # prior project and cost a full session.
    #
    # THE DIGEST IS THE PIN. Docker resolves `name:tag@sha256:...` by digest and ignores the tag,
    # so the two cannot disagree about what actually runs.
    #
    # THE TAG IS HOW THE DIGEST IS RE-DERIVABLE, and it is why this is not a bare
    # `name@sha256:...` reference. A digest is unresolvable in the one direction anyone ever needs
    # it: when the pin fails, the operator has to know which tag to pull in order to obtain the
    # correct digest, and a digest-only reference does not say. That is not hypothetical - it is
    # exactly how this line failed on the first attempt.
    #
    # Do not hand-edit the digest. `verify/preflight.py --write-digest` reads the tag below, asks
    # the local Docker daemon for that tag's repository digest, and rewrites this line. A
    # 64-character content hash is not a value a human should be typing: one wrong character
    # produces an error indistinguishable from a network failure.
    image: timescale/timescaledb:2.26.2-pg16@sha256:332b99870c99c20d0d852ec600c097ee00ac93f5e0c75a8e83673394cdb36bfd

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waterway}
      POSTGRES_USER: ${POSTGRES_USER:-waterway}
      # `:?` makes an unset password a hard startup failure rather than a container that comes up
      # with an empty one. The value lives in .env, which is gitignored; see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset - copy .env.example to .env and fill it in}

    volumes:
      # The separate EBS data volume from Phase 1, mounted by UUID via fstab (CLAUDE.md § 5).
      # Not a named Docker volume: a named volume lives under /var/lib/docker on the ROOT disk,
      # which is exactly the disk this project went to the trouble of not storing data on.
      - /mnt/data/timescaledb:/var/lib/postgresql/data

    healthcheck:
      # ===========================================================================================
      # A REAL QUERY OVER TCP AS THE REAL USER. NOT `pg_isready`, AND NOT BECAUSE IT IS STRICTER.
      # ===========================================================================================
      #
      # `pg_isready -U ... -d ...` was here through Phase 11 and it answers YES TO THE WRONG
      # SERVER. The official Postgres entrypoint runs `initdb` and then starts a TEMPORARY server
      # to apply initialisation - and that server listens ONLY on a unix socket in a private
      # directory, with no TCP listener at all. `pg_isready` without `-h` connects over exactly
      # that socket, so it reports healthy while the database the rest of the stack has to reach
      # does not yet exist.
      #
      # `api` gates on `condition: service_healthy`, so that made the API's startup ordering
      # decorative from Phase 2 onward: on a cold start the API could be released to connect to a
      # server that was still initialising. It is timing-dependent, which is why it has not been
      # seen - a slow initdb under load is when it would appear, and it would look like a
      # connection error from an application that had just been told the database was ready.
      #
      # The probe therefore requires three things initdb's temporary server cannot offer: a TCP
      # connection (`-h 127.0.0.1`), an authenticated session as the real user, and a query the
      # real database answers.
      #
      # NOT FIXED BY LENGTHENING start_period. A longer grace makes the race rarer, which is worse
      # than leaving it visible: an intermittent startup failure that only appears under load is
      # the expensive version of this bug. start_period stays at 30s and is a bound on how long a
      # legitimately slow start may take, not a way of not looking.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U ${POSTGRES_USER:-waterway} -d ${POSTGRES_DB:-waterway} -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Postgres uses shared memory for parallel query and hash joins; Docker's 64MB default is far
    # below what a 16-core-adjacent planner will try to take, and the failure is a runtime
    # "could not resize shared memory segment" during a large query, not a startup error.
    shm_size: 256mb

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------------
  # api — FastAPI under uvicorn. Internal only; Caddy is the only thing that can reach it.
  # ---------------------------------------------------------------------------------------------
  api:
    # Built, not pulled. The base image inside Dockerfile.api is pinned by digest and the digest is
    # a placeholder that CANNOT RESOLVE until a human replaces it on the instance — a build against
    # it fails with a manifest error rather than falling back to a floating tag (CLAUDE.md § 12).
    build:
      context: .
      dockerfile: Dockerfile.api

    restart: unless-stopped

    # NO `ports:`. Deliberate, and the single most important absence in this file. Caddy reaches
    # this container at `api:8000` over the Compose network; the port is not on the host at all, so
    # it is not on the internet, so the only route to the API is through TLS and the edge headers.
    #
    # `EXPOSE 8000` in the Dockerfile is documentation and does not publish anything.

    environment:
      # THE ONE VARIABLE THIS CONTAINER GETS. `:?` makes an unset value a hard startup failure
      # rather than a container that comes up connected to nothing, or — worse — one that falls
      # back to the owner role (see the header). Set it in .env; see .env.example for the shape.
      #
      # THE HOST IS `timescaledb`, NOT `localhost`. Inside the Compose network, loopback is this
      # container's own namespace, where nothing is listening on 5432. The loopback form worked
      # through Phase 9 only because uvicorn ran on the host beside the published-port override.
      # Getting this wrong is a connection-refused at container start, which is loud.
      API_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is unset - see .env.example; the host must be timescaledb, not localhost}

    depends_on:
      timescaledb:
        condition: service_healthy

    # The health check crosses the boundary where the failure would live: it asks the application
    # to serve a response that requires the database, so a container that is up while the database
    # is unreachable shows as unhealthy in `docker compose ps` instead of as running.
    #
    # It reports HEALTHY on a degraded stack, and that is correct. /api/health returns 200 with
    # `degraded: true` by design (CLAUDE.md § 20) — a stale ingest job is not the API being down,
    # and collapsing the two is what makes an uptime signal useless at three in the morning.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------------
  # scheduler — APScheduler and every scheduled job. Internal only; publishes nothing.
  # ---------------------------------------------------------------------------------------------
  #
  # THE FIRST COMMIT IN WHICH THE SCHEDULER RUNS IN PRODUCTION AT ALL. Before it, `job_runs` held
  # two probe rows written by verify/ harnesses in August 2026 and nothing else, `apscheduler_jobs`
  # held ZERO rows, and every ingest row in the database had arrived by manual backfill. The stack
  # reported `degraded: true` correctly from Phase 8 onward and nobody was watching.
  #
  # NO SEPARATE systemd UNIT, DELIBERATELY. `dws-stack.service` already carries
  # `RequiresMountsFor=/mnt/data` and `Requires=docker.service`, and the containers' own
  # `restart: unless-stopped` policies do the supervision. A `dws-scheduler.service` would restate
  # the mount guarantee in a second place, and the second copy is the one that drifts.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler

    restart: unless-stopped

    # NO `ports:`. It serves nothing and nothing connects to it; it is a process that wakes up on a
    # timer. The published-port set across this whole stack stays exactly {80, 443} and is asserted
    # by equality - if adding a service had required editing that assertion, something would be
    # wrong with the service.
    #
    # NO `volumes:` ENTRY FOR /var/run/docker.sock. See the header. This absence is asserted
    # stack-wide rather than for this service, because the reason applies equally to every service.

    environment:
      # ASSEMBLED FROM THE POSTGRES_* VARIABLES RATHER THAN PASSED THROUGH FROM `DATABASE_URL`,
      # AND THE REASON IS THAT THE HOST AND THE CONTAINER NEED DIFFERENT HOSTS FOR ONE DATABASE.
      #
      # `.env`'s DATABASE_URL points at localhost, because host-side tooling still needs it (see
      # the note at the top of this file). Inside the compose network, loopback is this container's
      # own namespace, where nothing listens on 5432 - so this container needs `timescaledb`.
      #
      # The tempting shape is a fourth variable in `.env` carrying the same password a fourth time.
      # That is a fourth copy of one secret, and `verify/preflight.py`'s agreement gate compares
      # POSTGRES_PASSWORD against DATABASE_URL only - so the new copy would be the one nothing
      # checks, which is always the copy that drifts (CLAUDE.md § 13). Composing from the variables
      # that are ALREADY gated adds no copy at all: the password appears here as a reference, and
      # the only literal is the compose-network hostname, which is a fact about this file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-waterway}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset - copy .env.example to .env and fill it in}@timescaledb:5432/${POSTGRES_DB:-waterway}

      # The backup bucket. NOT a secret and not derivable from anything else in here - it carries
      # the account id, so it is environment-specific and belongs in .env beside the rest.
      BACKUP_BUCKET: ${BACKUP_BUCKET:?BACKUP_BUCKET is unset - see .env.example; it is the terraform output `backup_bucket_name`}

      # NO AWS KEYS, EVER. Credentials come from the instance role over IMDS, which is reachable
      # from inside a container only because `http_put_response_hop_limit` is 2
      # (infra/terraform/compute.tf, asserted by tests/terraform/test_compute.py). At 1 the token
      # request dies one hop short and every S3 call fails with a credentials error that reads like
      # an IAM misconfiguration - and sends you to the wrong file.

    depends_on:
      # MEANINGFUL FOR THE FIRST TIME AS OF STAGE B. The healthcheck used to be `pg_isready`, which
      # answers yes to the temporary server `initdb` runs on a private unix socket - so this gate
      # released dependents against a database that did not exist yet. It is now a real query over
      # TCP as the real user.
      timescaledb:
        condition: service_healthy

    volumes:
      # THE BACKUP STAGING DIRECTORY, ON THE DATA VOLUME. The archive is written here with `-f`
      # before it is verified and uploaded; a dump that filled the ROOT volume would take the
      # instance down, while one that fills /mnt/data is bad and recoverable.
      #
      # IT MUST BE WRITABLE BY uid 10001, which is what this container runs as. Docker creates a
      # missing bind-mount source as root:root, so an absent directory becomes an unwritable one -
      # and the failure would land AFTER pg_dump had been invoked. Provisioning creates it:
      #     sudo install -d -o 10001 -g 10001 -m 0750 /mnt/data/backups /mnt/data/restore-test
      # and app/orchestration/backup.py asserts it is writable before dumping, because a
      # provisioning step nobody ran is indistinguishable from one that ran wrong.
      - /mnt/data/backups:/mnt/data/backups

      # The restore test's scratch space: the archive is downloaded FROM S3 into here before being
      # restored. Same ownership requirement, same reasoning.
      - /mnt/data/restore-test:/mnt/data/restore-test

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------------
  # frontend-build — runs to completion, writes the bundle into a volume, exits.
  # ---------------------------------------------------------------------------------------------
  #
  # NOT A SERVER. It copies a bundle built inside a pinned Node image into `frontend_dist` and
  # exits 0. `caddy` waits on `service_completed_successfully`, so the proxy never starts in front
  # of an empty directory.
  #
  # `restart: "no"` AND IT IS THE ONLY SERVICE HERE WITHOUT `unless-stopped`. That is not an
  # oversight and tests/deploy/test_compose_shape.py asserts the partition explicitly: a container
  # that exits on purpose, under a policy that restarts it whenever it is not running, is an
  # infinite rebuild loop. The quoted "no" is required — unquoted `no` is YAML's boolean false.
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    restart: "no"

    volumes:
      # The write side of the artifact handoff. Read side is caddy's, mounted read-only.
      - frontend_dist:/out

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------------
  # caddy — TLS termination, the static bundle, and the /api reverse proxy. THE ONLY PUBLIC FACE.
  # ---------------------------------------------------------------------------------------------
  caddy:
    # Pinned by digest, tagged for re-derivability, RESOLVED ON THE INSTANCE 2026-08-17.
    #
    # `caddy:2-alpine` is the major-2 rolling tag, so it floats and the digest is what actually
    # fixes the version.
    #
    # `verify/preflight.py --write-digest` DOES write this line — it enumerates every `image:` here
    # and every `FROM` in every Dockerfile, and rewrites each in place. It did not when this digest
    # was first resolved, so this one was hand-edited, which is the exact failure --write-digest
    # exists to remove. Do not hand-edit it again.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648

    restart: unless-stopped

    # THE ONLY PUBLISHED PORTS IN THE STACK. Exactly 80 and 443, unqualified by a host address, so
    # they are reachable from the internet — which is the point of this commit and is also the
    # entire change in threat model. The DOCKER-USER chain (provisioning 3) already accepts
    # `-i $EXT_IFACE` on precisely these two ports and drops everything else inbound on that
    # interface, and the security group (Phase 1) allows exactly {22 from the admin CIDR, 80, 443}.
    # Both were read and confirmed in this commit; neither was changed.
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Config, read-only, from the checkout. This is a bind mount of the git tree and is fine:
      # decision 6's prohibition is on serving a bind-mounted BUILD OUTPUT, where a `git pull`
      # would change the served site mid-deploy and a half-written bundle would be served
      # mid-write. A config file is read once at start and a reload is deliberate.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # THE BUNDLE, READ-ONLY, FROM A VOLUME — never from ./frontend/dist.
      - frontend_dist:/srv/frontend:ro

      # THE CERTIFICATE STORE ON THE DATA VOLUME (decision 9). /data holds the issued certificates
      # AND the ACME account key. A container recreate that loses the account key means re-issuance
      # against an endpoint that rate-limits per domain per week, which is how a site ends up
      # unable to get a certificate for days. /mnt/data is the separate EBS volume from Phase 1;
      # a named Docker volume would put this on the root disk instead.
      - /mnt/data/caddy/data:/data
      - /mnt/data/caddy/config:/config

    depends_on:
      # Not `service_healthy`: Caddy does not need the API up in order to start, and making TLS
      # issuance wait on a database would couple the two failures. A 502 from a running proxy is a
      # legible failure; no certificate is not.
      api:
        condition: service_started
      # This one IS a completion gate. Starting the file server before the bundle exists serves
      # 404s from a correctly-running site.
      frontend-build:
        condition: service_completed_successfully

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # The built React bundle. A named volume — i.e. on the ROOT disk under /var/lib/docker, not on
  # the data volume — and that is deliberate: this is a rebuildable artifact, not data. Losing it
  # costs one `docker compose run` of the build container. The certificate store, which is NOT
  # rebuildable without a rate-limited round trip to Let's Encrypt, is on /mnt/data above.
  frontend_dist:
